plugins {
    id "application"
    id "checkstyle"
    id "org.openjfx.javafxplugin" version "0.1.0"
}

group = "com.gymflow"
version = "0.1.0"

def javafxVersion = "25.0.2"
def sqliteVersion = "3.53.4.0"
def releaseTargets = [
        WindowsX64: [classifier: "win", fileName: "GymFlow-windows-x64.jar",
                     sqliteNative: "org/sqlite/native/Windows/x86_64/"],
        LinuxX64  : [classifier: "linux", fileName: "GymFlow-linux-x64.jar",
                     sqliteNative: "org/sqlite/native/Linux/x86_64/"],
        MacosX64  : [classifier: "mac", fileName: "GymFlow-macos-x64.jar",
                     sqliteNative: "org/sqlite/native/Mac/x86_64/"],
        MacosArm64: [classifier: "mac-aarch64", fileName: "GymFlow-macos-arm64.jar",
                     sqliteNative: "org/sqlite/native/Mac/aarch64/"]
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = "com.gymflow.ui.GymFlowApp"
}

javafx {
    version = javafxVersion
    modules = ["javafx.controls"]
}

checkstyle {
    toolVersion = "14.0.0"
    configFile = file("config/checkstyle/checkstyle.xml")
}

releaseTargets.each { target, details ->
    configurations.create("release${target}")
}

dependencies {
    implementation "org.xerial:sqlite-jdbc:${sqliteVersion}"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    releaseTargets.each { target, details ->
        add("release${target}", "org.xerial:sqlite-jdbc:${sqliteVersion}") {
            transitive = false
        }
        ["base", "graphics", "controls"].each { module ->
            add("release${target}", "org.openjfx:javafx-${module}:${javafxVersion}:${details.classifier}") {
                transitive = false
            }
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

releaseTargets.each { target, details ->
    tasks.register("release${target}", Jar) {
        group = "distribution"
        description = "Builds the ${target} executable JAR."
        dependsOn classes
        archiveFileName = details.fileName
        destinationDirectory = layout.projectDirectory.dir("release")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes "Main-Class": "com.gymflow.ui.Launcher"
        }

        from sourceSets.main.output
        from {
            configurations.getByName("release${target}").collect { zipTree(it) }
        } {
            eachFile { file ->
                if (file.path.startsWith("org/sqlite/native/")
                        && !file.path.startsWith(details.sqliteNative)) {
                    file.exclude()
                }
            }
        }
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    }
}

def verifyReleaseJars = tasks.register("verifyReleaseJars") {
    dependsOn releaseTargets.keySet().collect { "release${it}" }
    doLast {
        releaseTargets.each { target, details ->
            def jar = new java.util.zip.ZipFile(file("release/${details.fileName}"))
            try {
                def names = jar.entries().collect { it.name }
                assert names.contains("styles/app.css")
                assert names.contains("META-INF/services/java.sql.Driver")
                assert names.contains("org/sqlite/JDBC.class")
                def natives = names.findAll { it.startsWith("org/sqlite/native/") && !it.endsWith("/") }
                assert !natives.isEmpty()
                assert natives.every { it.startsWith(details.sqliteNative) }
            } finally {
                jar.close()
            }
        }
    }
}

tasks.register("releaseJars") {
    group = "distribution"
    description = "Builds and verifies executable JARs for all supported platforms."
    dependsOn verifyReleaseJars
}
