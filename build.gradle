import groovy.json.JsonSlurper

plugins {
    id "application"
    id "checkstyle"
    id "org.openjfx.javafxplugin" version "0.1.0"
}

group = "com.gymflow"
version = "0.1.0"

def javafxVersion = "25.0.2"
def sqliteVersion = "3.53.4.0"
def jacksonVersion = "2.20.0"
def localSupabaseUrl = "http://127.0.0.1:54321"
def localPublishableKey = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
def releaseTargets = [
        WindowsX64: [classifier: "win", fileName: "GymFlow-windows-x64.jar",
                     sqliteNative: "org/sqlite/native/Windows/x86_64/"],
        LinuxX64  : [classifier: "linux", fileName: "GymFlow-linux-x64.jar",
                     sqliteNative: "org/sqlite/native/Linux/x86_64/"],
        MacosX64  : [classifier: "mac", fileName: "GymFlow-macos-x64.jar",
                     sqliteNative: "org/sqlite/native/Mac/x86_64/"],
        MacosArm64: [classifier: "mac-aarch64", fileName: "GymFlow-macos-arm64.jar",
                     sqliteNative: "org/sqlite/native/Mac/aarch64/"]
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = "com.gymflow.ui.GymFlowApp"
}

javafx {
    version = javafxVersion
    modules = ["javafx.controls"]
}

checkstyle {
    toolVersion = "14.0.0"
    configFile = file("config/checkstyle/checkstyle.xml")
}

releaseTargets.each { target, details ->
    configurations.create("release${target}")
}

dependencies {
    implementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    releaseTargets.each { target, details ->
        add("release${target}", "org.xerial:sqlite-jdbc:${sqliteVersion}") {
            transitive = false
        }
        add("release${target}", "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")
        ["base", "graphics", "controls"].each { module ->
            add("release${target}", "org.openjfx:javafx-${module}:${javafxVersion}:${details.classifier}") {
                transitive = false
            }
        }
    }
}

test {
    useJUnitPlatform()
    inputs.property("gymflowLocalIntegration", System.getenv("GYMFLOW_LOCAL_INTEGRATION") ?: "")
}

sourceSets {
    renderedUiTest {
        java.srcDir "src/renderedUiTest/java"
        resources.srcDir "src/renderedUiTest/resources"
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    renderedUiTestImplementation.extendsFrom testImplementation
    renderedUiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register("renderedUiTest", Test) {
    group = "verification"
    description = "Runs rendered JavaFX UI tests on a desktop display."
    testClassesDirs = sourceSets.renderedUiTest.output.classesDirs
    classpath = sourceSets.renderedUiTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

def isLoopbackHost = { String host ->
    host != null && (host.equalsIgnoreCase("localhost") || host == "127.0.0.1"
            || host == "::1" || host == "[::1]")
}

def requireProductionConfiguration = {
    def selectedEnvironment = System.getenv("GYMFLOW_ENV")
    def configuredUrl = System.getenv("GYMFLOW_SUPABASE_URL")
    def publishableKey = System.getenv("GYMFLOW_SUPABASE_PUBLISHABLE_KEY")
    if (!"production".equalsIgnoreCase(selectedEnvironment)) {
        throw new GradleException("Production tasks require GYMFLOW_ENV=production")
    }
    if (configuredUrl == null || configuredUrl.isBlank()) {
        throw new GradleException("Production tasks require GYMFLOW_SUPABASE_URL")
    }
    def uri = URI.create(configuredUrl)
    if (!"https".equalsIgnoreCase(uri.scheme) || uri.host == null || isLoopbackHost(uri.host)) {
        throw new GradleException("Production tasks require a non-loopback HTTPS Supabase URL")
    }
    if (publishableKey == null || !publishableKey.startsWith("sb_publishable_")) {
        throw new GradleException("Production tasks require a Supabase publishable key")
    }
    [url: configuredUrl, key: publishableKey]
}

tasks.named("run", JavaExec) {
    environment "GYMFLOW_ENV", "local"
    environment "GYMFLOW_SUPABASE_URL", localSupabaseUrl
    environment "GYMFLOW_SUPABASE_PUBLISHABLE_KEY", localPublishableKey
    doFirst {
        def selectedEnvironment = System.getenv("GYMFLOW_ENV")
        if (selectedEnvironment != null && !selectedEnvironment.isBlank()
                && !"local".equalsIgnoreCase(selectedEnvironment)) {
            throw new GradleException("runLocal refuses a non-local GYMFLOW_ENV")
        }
        def configuredUrl = System.getenv("GYMFLOW_SUPABASE_URL")
        if (configuredUrl != null && !configuredUrl.isBlank()
                && !isLoopbackHost(URI.create(configuredUrl).host)) {
            throw new GradleException("runLocal refuses a non-loopback Supabase URL")
        }
    }
}

tasks.register("runLocal") {
    group = "application"
    description = "Runs GymFlow against the loopback Supabase development stack."
    dependsOn tasks.named("run")
}

def verifyProductionConfiguration = tasks.register("verifyProductionConfiguration") {
    group = "verification"
    description = "Rejects unsafe or incomplete production client configuration."
    doLast {
        def configuration = requireProductionConfiguration()
        logger.lifecycle("Production target verified: ${URI.create(configuration.url).host}")
    }
}

releaseTargets.each { target, details ->
    tasks.register("release${target}", Jar) {
        group = "distribution"
        description = "Builds the ${target} executable JAR."
        dependsOn classes
        archiveFileName = details.fileName
        destinationDirectory = layout.projectDirectory.dir("release")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes "Main-Class": "com.gymflow.ui.Launcher"
        }

        from sourceSets.main.output
        from {
            configurations.getByName("release${target}").collect { zipTree(it) }
        } {
            eachFile { file ->
                if (file.path.startsWith("org/sqlite/native/")
                        && !file.path.startsWith(details.sqliteNative)) {
                    file.exclude()
                }
            }
        }
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    }
}

def verifyReleaseJars = tasks.register("verifyReleaseJars") {
    dependsOn releaseTargets.keySet().collect { "release${it}" }
    doLast {
        releaseTargets.each { target, details ->
            def jar = new java.util.zip.ZipFile(file("release/${details.fileName}"))
            try {
                def names = jar.entries().collect { it.name }
                assert names.contains("styles/app.css")
                assert names.contains("META-INF/services/java.sql.Driver")
                assert names.contains("org/sqlite/JDBC.class")
                assert names.contains("com/fasterxml/jackson/databind/ObjectMapper.class")
                def natives = names.findAll { it.startsWith("org/sqlite/native/") && !it.endsWith("/") }
                assert !natives.isEmpty()
                assert natives.every { it.startsWith(details.sqliteNative) }
            } finally {
                jar.close()
            }
        }
    }
}

tasks.register("releaseJars") {
    group = "distribution"
    description = "Builds production executable JARs after validating production configuration."
    dependsOn verifyProductionConfiguration, verifyReleaseJars
}

verifyReleaseJars.configure {
    mustRunAfter verifyProductionConfiguration
}

tasks.register("verifyLocal") {
    group = "verification"
    description = "Runs all local Java, UI, style, and release-structure checks."
    dependsOn check, renderedUiTest, verifyReleaseJars
}

tasks.register("productionSmokeTest") {
    group = "verification"
    description = "Checks production Auth and anonymous-access safeguards without user credentials."
    dependsOn verifyProductionConfiguration
    doLast {
        def configuration = requireProductionConfiguration()
        def request = { String path, String method, String body ->
            HttpURLConnection connection = (HttpURLConnection) new URL(configuration.url + path)
                    .openConnection()
            connection.requestMethod = method
            connection.connectTimeout = 10_000
            connection.readTimeout = 10_000
            connection.setRequestProperty("apikey", configuration.key)
            if (body != null) {
                connection.doOutput = true
                connection.setRequestProperty("Content-Type", "application/json")
                connection.outputStream.withCloseable { stream ->
                    stream.write(body.getBytes("UTF-8"))
                }
            }
            def status = connection.responseCode
            def stream = status >= 400 ? connection.errorStream : connection.inputStream
            def responseBody = stream == null ? "" : stream.getText("UTF-8")
            connection.disconnect()
            [status: status, body: responseBody]
        }

        def settings = request("/auth/v1/settings", "GET", null)
        if (settings.status != 200
                || new JsonSlurper().parseText(settings.body).disable_signup != true) {
            throw new GradleException("Production public signup is not disabled")
        }
        def accounts = request("/rest/v1/accounts?select=id", "GET", null)
        if (!(accounts.status in [401, 403])) {
            throw new GradleException("Anonymous account access was not rejected")
        }
        def memberFunction = request("/functions/v1/manage-member", "POST", "{}")
        if (!(memberFunction.status in [401, 403])) {
            throw new GradleException("Protected account management accepted an anonymous request")
        }
        logger.lifecycle("Production smoke checks passed for ${URI.create(configuration.url).host}")
    }
}
