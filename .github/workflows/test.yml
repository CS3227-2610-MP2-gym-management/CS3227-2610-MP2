name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            gradle: ./gradlew
            release-task: releaseLinuxX64
            artifact-name: linux-x64
            artifact-path: release/GymFlow-linux-x64.jar
          - os: windows-latest
            gradle: .\gradlew.bat
            release-task: releaseWindowsX64
            artifact-name: windows-x64
            artifact-path: release/GymFlow-windows-x64.jar
          - os: macos-latest
            gradle: ./gradlew
            release-task: releaseMacosArm64
            artifact-name: macos-arm64
            artifact-path: release/GymFlow-macos-arm64.jar
          - os: macos-15-intel
            gradle: ./gradlew
            release-task: releaseMacosX64
            artifact-name: macos-x64
            artifact-path: release/GymFlow-macos-x64.jar

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Check and package
        run: ${{ matrix.gradle }} --no-daemon clean check ${{ matrix.release-task }}

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset and test the database
        run: |
          supabase db reset --local
          supabase test db

      - name: Run cloud integration tests
        env:
          GYMFLOW_LOCAL_INTEGRATION: "true"
        run: ./gradlew --no-daemon test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

